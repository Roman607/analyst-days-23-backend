server {
    listen 8445 ssl;
    server_name ad23-track.89.23.100.193.nip.io;

    ssl_certificate /etc/letsencrypt/live/ad23-track.89.23.100.193.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad23-track.89.23.100.193.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/stderr warn;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}

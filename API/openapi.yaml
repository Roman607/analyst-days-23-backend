openapi: 3.1.0
info:
  title: Analyst Days 23 — программа и очная траектория
  version: 1.0.0-draft
  description: Проект контракта для двух ТЗ. Запросы анонимны. Бэкенд читает программу из SQLite и возвращает результат расчёта.
paths:
  /api/health:
    get:
      operationId: checkHealth
      summary: Проверить готовность API и доступность опубликованной программы
      responses:
        '200':
          description: Программу можно прочитать
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {const: ok}
              example: {status: ok}
        '503': {$ref: '#/components/responses/ProgramUnavailable'}
  /api/program:
    get:
      operationId: getProgram
      summary: Получить одну согласованную версию программы на оба дня
      responses:
        '200':
          description: Полная сетка, включая перерывы и хакатон
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Program'}
              examples:
                fragment:
                  summary: Сокращённый учебный снимок с одной параллелью 21 ноября
                  value:
                    revision: ad23-demo-1
                    timezone: Europe/Moscow
                    days: ['2026-11-20', '2026-11-21']
                    rooms:
                      - {id: A, name: Зал A}
                      - {id: B, name: Зал B}
                      - {id: C, name: Зал C}
                      - {id: D, name: Зал D}
                    topics: [{id: ai, name: ИИ}]
                    entries:
                      - {id: neverov, kind: talk, title: ИИ-агенты в Enterprise, speakers: Дмитрий Неверов, day: '2026-11-21', starts_at: '16:30', ends_at: '17:10', room_id: A, topic_ids: [ai], previous_part_id: null}
                      - {id: bonareva, kind: talk, title: Wiki в Git для ИИ-агента, speakers: Вера Бонарева, day: '2026-11-21', starts_at: '16:30', ends_at: '17:10', room_id: B, topic_ids: [ai], previous_part_id: null}
        '503': {$ref: '#/components/responses/ProgramUnavailable'}
  /api/trajectory/preview:
    post:
      operationId: previewTrajectory
      summary: Рассчитать выделение карточек и состав изображения
      description: Каждый запрос полностью описывает выбор. Повтор того же запроса при той же версии программы даёт тот же результат.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewRequest'}
            examples:
              initial: {value: {revision: ad23-demo-1, topic_ids: [], actions: []}}
              byTopic: {value: {revision: ad23-demo-1, topic_ids: [ai], actions: []}}
              manual:
                value:
                  revision: ad23-demo-1
                  topic_ids: [ai]
                  actions: [{op: choose, entry_id: bonareva}]
      responses:
        '200':
          description: Результат для переданных тем и действий
          headers:
            Cache-Control: {schema: {type: string, const: no-store}, description: Ответ содержит текущий выбор.}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preview'}
              examples:
                initial: {value: {revision: ad23-demo-1, items: [], is_custom: false}}
                byTopic:
                  value:
                    revision: ad23-demo-1
                    items:
                      - {entry_id: neverov, state: alternative, conflicts_with: [bonareva]}
                      - {entry_id: bonareva, state: alternative, conflicts_with: [neverov]}
                    is_custom: false
                manual:
                  value:
                    revision: ad23-demo-1
                    items: [{entry_id: bonareva, state: selected, conflicts_with: []}]
                    is_custom: true
        '409':
          description: Версия программы в запросе устарела
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Error'}
                  - properties: {code: {enum: [stale_program]}}
              example: {code: stale_program, message: Программа обновилась. Загрузите её заново.}
        '422':
          description: Ошибка JSON, структуры запроса, идентификатора или действия
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Error'}
                  - properties: {code: {enum: [invalid_request, unknown_topic, unknown_entry, not_selectable, not_continuation]}}
              example: {code: not_selectable, message: Хакатон не участвует в подборе.}
        '503': {$ref: '#/components/responses/ProgramUnavailable'}
components:
  responses:
    ProgramUnavailable:
      description: Нет доступного проверенного снимка программы
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - properties: {code: {enum: [program_unavailable]}}
          example: {code: program_unavailable, message: Программа временно недоступна.}
  schemas:
    Id:
      type: string
      minLength: 1
      description: Стабильный идентификатор из программы. Регистр значим.
    Ids:
      type: array
      uniqueItems: true
      items: {$ref: '#/components/schemas/Id'}
    Day:
      type: string
      enum: ['2026-11-20', '2026-11-21']
    Clock:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Местное время конференции, ЧЧ:ММ
    NamedItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1}
    Program:
      type: object
      additionalProperties: false
      required: [revision, timezone, days, rooms, topics, entries]
      properties:
        revision: {$ref: '#/components/schemas/Id'}
        timezone: {const: Europe/Moscow}
        days: {const: ['2026-11-20', '2026-11-21']}
        rooms: {type: array, items: {$ref: '#/components/schemas/NamedItem'}}
        topics: {type: array, items: {$ref: '#/components/schemas/NamedItem'}}
        entries: {type: array, items: {$ref: '#/components/schemas/Entry'}}
    Entry:
      type: object
      additionalProperties: false
      required: [id, kind, title, speakers, day, starts_at, ends_at, room_id, topic_ids, previous_part_id]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {enum: [talk, blitz, workshop, discussion, break, service, hackathon]}
        title: {type: string, minLength: 1}
        speakers: {type: [string, 'null'], description: Подпись выступающих в программе}
        day: {$ref: '#/components/schemas/Day'}
        starts_at: {$ref: '#/components/schemas/Clock'}
        ends_at: {$ref: '#/components/schemas/Clock'}
        room_id: {type: [string, 'null'], description: null для общей полосы сетки}
        topic_ids: {$ref: '#/components/schemas/Ids'}
        previous_part_id: {type: [string, 'null'], description: Ссылка на предшествующую часть мастер-класса}
    Action:
      type: object
      additionalProperties: false
      required: [op, entry_id]
      properties:
        op: {enum: [choose, skip_continuation]}
        entry_id: {$ref: '#/components/schemas/Id'}
    PreviewRequest:
      type: object
      additionalProperties: false
      required: [revision, topic_ids, actions]
      properties:
        revision: {$ref: '#/components/schemas/Id'}
        topic_ids: {$ref: '#/components/schemas/Ids'}
        actions:
          type: array
          description: Ручные действия по порядку после последнего изменения или обновления фильтра
          items: {$ref: '#/components/schemas/Action'}
    Preview:
      type: object
      additionalProperties: false
      required: [revision, items, is_custom]
      properties:
        revision: {$ref: '#/components/schemas/Id'}
        items:
          type: array
          description: Подсвеченные карточки обоих дней в порядке для картинки
          items:
            type: object
            additionalProperties: false
            required: [entry_id, state, conflicts_with]
            properties:
              entry_id: {$ref: '#/components/schemas/Id'}
              state: {enum: [selected, alternative]}
              conflicts_with: {$ref: '#/components/schemas/Ids'}
        is_custom: {type: boolean, description: Итоговое выделение отличается от автоматического по тем же темам}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {enum: [invalid_request, unknown_topic, unknown_entry, not_selectable, not_continuation, stale_program, program_unavailable]}
        message: {type: string, minLength: 1, description: Пояснение для участника на русском языке}

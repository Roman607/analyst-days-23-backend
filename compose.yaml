name: ad23-track
services:
  backend:
    image: ${BACKEND_IMAGE:?Укажите образ бэкенда}
    environment:
      PROGRAM_DB: /app/data/program.sqlite3
    volumes:
      - type: bind
        source: ${PROGRAM_FILE:?Укажите файл SQLite}
        target: /app/data/program.sqlite3
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:?Укажите образ фронтенда}
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8445:8445"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TLS_DIR:?Укажите каталог сертификата}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
